<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Gachapon Prize Guide — Luna Wedding</title>

  <link rel="canonical" href="https://luna.wedding/q/gachapon/" />
  <meta name="robots" content="noindex, follow" />

  <script>
    /*
      EDIT THIS URL ANYTIME.
      The printed QR should always point to:
      https://luna.wedding/q/gachapon/

      Change only DESTINATION_URL if you ever need to redirect guests somewhere else.
    */
    const DESTINATION_URL = "https://luna.wedding/gachapon/";

    window.addEventListener("DOMContentLoaded", () => {
      const link = document.getElementById("manual-link");
      if (link) link.href = DESTINATION_URL;

      setTimeout(() => {
        window.location.href = DESTINATION_URL;
      }, 700);
    });
  </script>

  <style>
    :root {
      --paper: #f7f0e8;
      --paper-soft: rgba(255, 250, 244, 0.88);
      --ink: #3d3530;
      --muted: #7a6f68;
      --line: rgba(61, 53, 48, 0.18);
      --button: rgba(255, 250, 244, 0.74);
      --button-hover: rgba(255, 250, 244, 0.96);
      --shadow: 0 18px 45px rgba(61, 53, 48, 0.18);
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        linear-gradient(rgba(247, 240, 232, 0.78), rgba(247, 240, 232, 0.9)),
        url("../../assets/weddinginvite.png?v=15") center / cover no-repeat fixed;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.58), transparent 42%),
        linear-gradient(to bottom, rgba(247,240,232,0.12), rgba(247,240,232,0.66));
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(560px, 100%);
      padding: 34px 26px;
      text-align: center;
      background: var(--paper-soft);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .eyebrow {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 58px);
      line-height: 0.98;
      font-weight: 400;
      letter-spacing: -0.04em;
    }

    p {
      max-width: 420px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin-top: 24px;
      padding: 11px 20px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--button);
      color: var(--ink);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      box-shadow: 0 8px 24px rgba(61, 53, 48, 0.08);
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .button:hover,
    .button:focus {
      background: var(--button-hover);
      transform: translateY(-1px);
      box-shadow: 0 10px 28px rgba(61, 53, 48, 0.13);
    }

    .small {
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: rgba(61, 53, 48, 0.58);
    }

    @media (max-width: 640px) {
      body {
        background-attachment: scroll;
      }

      .card {
        padding: 30px 20px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <p class="eyebrow">Tobias + Michelle</p>
    <h1>Opening Prize Guide</h1>
    <p>
      You’re being sent to the gachapon prize guide.
    </p>

    <a id="manual-link" class="button" href="https://luna.wedding/gachapon/">
      Open Prize Guide
    </a>

    <p class="small">
      If nothing happens, tap the button above.
    </p>
  </main>
</body>
</html>
