  <style>
    /* ===== START DESIGN VARIABLES ===== */
    :root{
      --text:#3c2f2f;
      --muted:#6f5959;
      --pink:#d8a6a6;
      --pink-dark:#c98f8f;
      --pink-deep:#b97878;
      --pink-light:#f3dede;
      --cream:rgba(255,248,244,.78);
      --cream-strong:rgba(255,248,244,.90);
      --border:rgba(216,166,166,.48);
      --shadow:0 20px 48px rgba(80,45,45,.16);
      --chrome-gray:#736f6e;
      --bg-overlay:linear-gradient(
        180deg,
        rgba(255,246,242,.46),
        rgba(255,246,242,.20) 45%,
        rgba(255,246,242,.36)
      );
    }
    /* ===== END DESIGN VARIABLES ===== */

    /* ===== START BASE PAGE RESET ===== */
    *{
      box-sizing:border-box;
    }

    html,
    body{
      height:100%;
      margin:0;
      color:var(--text);
      background:
        var(--bg-overlay),
        url("assets/bg.jpg?v=37") center center / cover no-repeat var(--chrome-gray);
      overflow:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      color-scheme:light only;
    }
    /* ===== END BASE PAGE RESET ===== */

    /* ===== START ANIMATIONS ===== */
    @keyframes fadeBg{
      from{ opacity:0; }
      to{ opacity:1; }
    }

    @keyframes fadeCard{
      from{
        opacity:0;
        transform:translate(-50%,-48%) scale(.985);
      }
      to{
        opacity:1;
        transform:translate(-50%,-50%) scale(1);
      }
    }
    /* ===== END ANIMATIONS ===== */

    /* ===== START BACKGROUND IMAGE ===== */
    .bg{
      position:fixed;
      inset:0;
      z-index:0;
      opacity:0;
      animation:fadeBg 900ms ease-out .05s forwards;
      background:
        var(--bg-overlay),
        url("assets/bg.jpg?v=37") center center / cover no-repeat var(--chrome-gray);
    }

    .bg img{
      width:100vw;
      height:100vh;
      object-fit:cover;
      object-position:center;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
      filter:brightness(1.04) saturate(.96);
    }

    .bg::after{
      content:"";
      position:absolute;
      inset:0;
      background:var(--bg-overlay);
      pointer-events:none;
    }
    /* ===== END BACKGROUND IMAGE ===== */

    /* ===== START INVITATION IMAGE ===== */
    .invite{
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      max-width:min(92vw,900px);
      max-height:88vh;
      width:auto;
      height:auto;
      display:block;
      border-radius:14px;
      background:#fff;
      box-shadow:0 20px 48px rgba(80,45,45,.20);
      opacity:0;
      animation:fadeCard .75s cubic-bezier(.21,.98,.25,.99) .2s forwards;
      cursor:zoom-in;
      user-select:none;
      -webkit-user-drag:none;
      z-index:3;
    }
    /* ===== END INVITATION IMAGE ===== */

    /* ===== START TAP TO ZOOM HINT ===== */
    .hint{
      position:fixed;
      left:50%;
      bottom:calc(84px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      padding:10px 14px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.64);
      background:rgba(216,166,166,.72);
      color:var(--text);
      font-size:14px;
      font-weight:700;
      line-height:1.15;
      box-shadow:0 8px 24px rgba(80,45,45,.15);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      z-index:30;
      cursor:pointer;
      opacity:0;
      transition:opacity 600ms ease, transform 600ms ease, background .15s ease, border-color .15s ease;
    }

    .hint:hover{
      background:rgba(216,166,166,.88);
      border-color:rgba(255,255,255,.76);
    }

    .hint.show{
      opacity:1;
      transform:translate(-50%, -4px);
    }

    .hint.hide{
      opacity:0;
      transform:translate(-50%, 4px);
    }

    body.menu-open .hint{
      opacity:0 !important;
      pointer-events:none;
      transform:translate(-50%, 4px);
      transition:none;
    }
    /* ===== END TAP TO ZOOM HINT ===== */

    /* ===== START LIGHTBOX / ZOOM VIEW ===== */
    .lightbox{
      position:fixed;
      inset:0;
      background:rgba(60,47,47,.38);
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      pointer-events:none;
      z-index:10;
      transition:opacity 280ms ease, background-color 180ms ease;
      -webkit-backdrop-filter:blur(8px) saturate(120%);
      backdrop-filter:blur(8px) saturate(120%);
    }

    .lightbox.visible{
      opacity:1;
      pointer-events:auto;
    }

    .lightbox.closing{
      background:rgba(60,47,47,.70);
    }

    .lightbox img{
      max-width:94vw;
      max-height:92vh;
      border-radius:14px;
      box-shadow:0 24px 64px rgba(80,45,45,.40);
      transform:scale(.96);
      transition:transform 280ms cubic-bezier(.23,1,.32,1);
      touch-action:pinch-zoom;
      cursor:zoom-out;
    }

    .lightbox.visible img{
      transform:scale(1);
    }
    /* ===== END LIGHTBOX / ZOOM VIEW ===== */

    /* ===== START CLOSE BUTTONS ===== */
    .close,
    .menu-close{
      position:fixed;
      top:calc(12px + env(safe-area-inset-top));
      right:calc(12px + env(safe-area-inset-right));
      width:44px;
      height:44px;
      border:1px solid rgba(216,166,166,.55);
      border-radius:999px;
      background:rgba(255,248,244,.94);
      color:var(--text);
      font-size:22px;
      line-height:1;
      cursor:pointer;
      opacity:0;
      pointer-events:none;
      transform:scale(.85);
      box-shadow:0 8px 24px rgba(80,45,45,.18);
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      transition:opacity 260ms ease .1s, transform 260ms ease .1s, background .15s ease;
    }

    .close:hover,
    .menu-close:hover{
      background:rgba(255,248,244,1);
    }

    .close{
      z-index:45;
    }

    .menu-close{
      z-index:34;
    }

    .lightbox.visible .close{
      opacity:1;
      pointer-events:auto;
      transform:scale(1);
    }

    body.menu-open .menu-close{
      opacity:1;
      pointer-events:auto;
      transform:scale(1);
    }

    body.zoom-open .menu-close{
      opacity:0;
      pointer-events:none;
    }
    /* ===== END CLOSE BUTTONS ===== */

    /* ===== START ACTION MENU ===== */
    .actions{
      position:fixed;
      left:50%;
      bottom:calc(4px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      z-index:30;
      display:flex;
      gap:8px;
      flex-wrap:nowrap;
      overflow-x:auto;
      overflow-y:hidden;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      max-width:min(92vw,980px);
      padding:12px 8px;
      opacity:0;
      pointer-events:none;
      transition:opacity .28s ease, transform .28s ease, bottom .28s ease;
    }

    .actions::-webkit-scrollbar{
      display:none;
    }

    .actions.show{
      bottom:calc(72px + env(safe-area-inset-bottom));
      opacity:1;
      pointer-events:auto;
      transform:translateX(-50%) translateY(-4px);
    }

    body.zoom-open .actions{
      bottom:calc(4px + env(safe-area-inset-bottom));
      opacity:1;
      pointer-events:auto;
      transform:translateX(-50%) translateY(-4px);
    }
    /* ===== END ACTION MENU ===== */

    /* ===== START SHARED PINK BUTTON STYLE ===== */
    .btn,
    .pill{
      appearance:none;
      border:1px solid rgba(255,255,255,.64);
      color:var(--text);
      background:rgba(216,166,166,.72);
      padding:10px 14px;
      border-radius:999px;
      font-size:14px;
      font-weight:700;
      line-height:1.15;
      text-decoration:none;
      cursor:pointer;
      white-space:nowrap;
      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
      box-shadow:0 8px 24px rgba(80,45,45,.15);
      transition:transform .15s ease, background .15s ease, box-shadow .15s ease, border-color .15s ease;
      text-align:center;
      user-select:none;
    }

    .btn:hover,
    .pill:hover{
      transform:translateY(-1px);
      background:rgba(216,166,166,.88);
      border-color:rgba(255,255,255,.76);
    }

    .btn{
      flex:0 0 auto;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
    }

    .pill.on{
      background:rgba(185,120,120,.92);
      color:#fff;
      border-color:rgba(255,255,255,.82);
      box-shadow:
        0 10px 28px rgba(80,45,45,.22),
        inset 0 0 0 1px rgba(255,255,255,.20);
    }

    .pill .dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:rgba(185,120,120,.70);
      box-shadow:0 0 0 1px rgba(255,255,255,.32);
    }

    .pill.on .dot{
      background:#fff;
      box-shadow:0 0 10px rgba(255,255,255,.72);
    }
    /* ===== END SHARED PINK BUTTON STYLE ===== */

    /* ===== START CALENDAR POPUP ===== */
    .calendar-pop{
      position:fixed;
      left:0;
      top:0;
      transform:translate(-9999px,-9999px);
      display:flex;
      flex-direction:column;
      gap:6px;
      z-index:80;
      opacity:0;
      visibility:hidden;
      pointer-events:none;
      transition:opacity .16s ease;
    }

    .calendar-pop.show{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }

    .calendar-pop .btn{
      min-width:180px;
      background:rgba(255,248,244,.92);
      border:1px solid rgba(216,166,166,.55);
      color:var(--text);
      box-shadow:0 8px 24px rgba(80,45,45,.16);
    }

    .calendar-pop .btn:hover{
      background:rgba(255,248,244,1);
    }
    /* ===== END CALENDAR POPUP ===== */

    /* ===== START BOTTOM DOCK ===== */
    .dock{
      position:fixed;
      left:12px;
      bottom:calc(12px + env(safe-area-inset-bottom));
      display:flex;
      align-items:center;
      gap:8px;
      z-index:20;
      transition:opacity .2s ease, transform .2s ease;
    }

    body.zoom-open .dock{
      opacity:0;
      pointer-events:none;
      transform:translateY(8px);
    }
    /* ===== END BOTTOM DOCK ===== */

    /* ===== START MOBILE BACKGROUND EXTENSION ===== */
    @media (max-width: 640px){
      html,
      body{
        background:
          var(--bg-overlay),
          url("assets/bg.jpg?v=37") center center / cover no-repeat #000;
      }

      .bg{
        background:
          var(--bg-overlay),
          url("assets/bg.jpg?v=37") center center / cover no-repeat #000;
      }
    }
    /* ===== END MOBILE BACKGROUND EXTENSION ===== */

    /* ===== START MOBILE STYLES ===== */
    @media (max-width: 430px){
      .actions{
        overflow-x:visible;
        overflow-y:visible;
        flex-wrap:wrap;
        justify-content:center;
        row-gap:8px;
        max-width:92vw;
        padding:12px 12px;
      }

      .actions.show{
        bottom:calc(72px + env(safe-area-inset-bottom));
      }

      .btn{
        flex:1 1 calc(50% - 8px);
        text-align:center;
      }

      .calendar-pop .btn{
        min-width:160px;
      }
    }

    @media (max-width: 340px){
      .btn{
        flex:1 1 100%;
      }

      .dock{
        left:50%;
        transform:translateX(-50%);
      }
    }
    /* ===== END MOBILE STYLES ===== */
  </style>
  <!-- ===== END PAGE STYLES ===== -->
</head>
<body>

  <!-- ===== START PAGE SCRIPT ===== -->
  <script>
    (function(){
      /* ===== START SAFARI / MOBILE CHROME COLOR CONTROL ===== */
      const DESKTOP_CHROME_COLOR = '#736f6e';
      const DESKTOP_CHROME_COLOR_NUDGE = '#706c6b';
      const MOBILE_BREAKPOINT = 640;
      let lastChromeMode = null;

      function isMobileViewport(){
        return window.matchMedia('(max-width: ' + MOBILE_BREAKPOINT + 'px)').matches;
      }

      function clearThemeColors(){
        document
          .querySelectorAll('meta[name="theme-color"]')
          .forEach((el) => el.remove());
      }

      function applyChromeColorMode(){
        const mode = isMobileViewport() ? 'mobile' : 'desktop';
        if (mode === lastChromeMode) return;
        lastChromeMode = mode;
        clearThemeColors();
        if (mode === 'mobile'){
          return;
        }

        const metaLight = document.createElement('meta');
        metaLight.name = 'theme-color';
        metaLight.content = DESKTOP_CHROME_COLOR;
        metaLight.setAttribute('media', '(prefers-color-scheme: light)');
        document.head.appendChild(metaLight);

        const metaDark = document.createElement('meta');
        metaDark.name = 'theme-color';
        metaDark.content = DESKTOP_CHROME_COLOR;
        metaDark.setAttribute('media', '(prefers-color-scheme: dark)');
        document.head.appendChild(metaDark);

        const meta = document.createElement('meta');
        meta.name = 'theme-color';
        meta.content = DESKTOP_CHROME_COLOR;
        document.head.appendChild(meta);

        requestAnimationFrame(() => {
          meta.content = DESKTOP_CHROME_COLOR_NUDGE;
          requestAnimationFrame(() => {
            meta.content = DESKTOP_CHROME_COLOR;
          });
        });
      }

      applyChromeColorMode();

      window.addEventListener('pageshow', () => {
        lastChromeMode = null;
        applyChromeColorMode();
      });

      window.addEventListener('resize', applyChromeColorMode);

      window.addEventListener('orientationchange', () => {
        lastChromeMode = null;
        setTimeout(applyChromeColorMode, 80);
      });

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden){
          lastChromeMode = null;
          applyChromeColorMode();
        }
      });
      /* ===== END SAFARI / MOBILE CHROME COLOR CONTROL ===== */

      /* ===== START ELEMENT REFERENCES ===== */
      const body = document.body;
      const invite = document.getElementById('invite');
      const hint = document.getElementById('hint');
      const lb = document.getElementById('lightbox');
      const lbimg = document.getElementById('lbimg');
      const zoomCloseBtn = lb.querySelector('.close');
      const actionsWrap = document.getElementById('actions');
      const menuBtn = document.getElementById('menuBtn');
      const menuCloseBtn = document.getElementById('menuCloseBtn');
      const musicBtn = document.getElementById('music');
      const calendarToggleBtn = document.getElementById('calendarToggleBtn');
      const calendarPop = document.getElementById('calendarPop');
      const appleCalBtn = document.getElementById('appleCalBtn');
      const googleCalBtn = document.getElementById('googleCalBtn');
      /* ===== END ELEMENT REFERENCES ===== */

      /* ===== START EVENT DETAILS ===== */
      const EVENT = {
        title: "Toby and Michelle's Wedding",
        description: "Toby and Michelle's wedding. Visit https://luna.wedding for more details.",
        venueName: "Carne Mare – Seaport",
        location: "89 South St, New York, NY 10038",
        mapsUrl: "https://maps.app.goo.gl/vTsV19gqAxjDsSb88?g_st=ic",
        startUTC: '20260606T230000Z',
        endUTC:   '20260607T020000Z'
      };
      /* ===== END EVENT DETAILS ===== */

      /* ===== START CALENDAR HELPERS ===== */
      function isAndroid(){
        return /Android/i.test(navigator.userAgent);
      }

      function fold(line){
        const CRLF = '\r\n';
        if (line.length <= 74) return line;
        let out = '';
        while (line.length > 74){
          out += line.slice(0,74) + CRLF + ' ';
          line = line.slice(74);
        }
        return out + line;
      }

      function buildEventDetailsText(){
        return [
          EVENT.description,
          '',
          `Venue: ${EVENT.venueName}`,
          `Map (Google): ${EVENT.mapsUrl}`
        ].join('\n');
      }

      function buildICSDescription(){
        return [
          EVENT.description,
          '',
          `Venue: ${EVENT.venueName}`,
          `Map (Google): ${EVENT.mapsUrl}`
        ].join('\\n');
      }

      function buildICS(){
        const CRLF = '\r\n';
        return [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//luna.wedding//Wedding//EN',
          'CALSCALE:GREGORIAN',
          'METHOD:PUBLISH',
          'BEGIN:VEVENT',
          `UID:${(crypto.randomUUID ? crypto.randomUUID() : ('luna-' + Date.now()))}@luna.wedding`,
          `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').split('.')[0]}Z`,
          `DTSTART:${EVENT.startUTC}`,
          `DTEND:${EVENT.endUTC}`,
          fold(`SUMMARY:${EVENT.title}`),
          fold(`DESCRIPTION:${buildICSDescription()}`),
          fold(`LOCATION:${EVENT.location}`),
          'END:VEVENT',
          'END:VCALENDAR',
          ''
        ].join(CRLF);
      }

      function positionCalendarPop(){
        const r = calendarToggleBtn.getBoundingClientRect();
        const popW = (window.innerWidth <= 430) ? 170 : 190;
        const gap = 8;
        let left = r.left + (r.width / 2) - (popW / 2);
        left = Math.max(12, Math.min(left, window.innerWidth - popW - 12));
        const top = Math.max(12, r.top - 92 - gap);
        calendarPop.style.left = left + 'px';
        calendarPop.style.top = top + 'px';
        calendarPop.style.transform = 'translate(0,0)';
      }

      function showCalendarPop(){
        positionCalendarPop();
        calendarPop.style.willChange = 'opacity';
        calendarPop.classList.add('show');
        calendarPop.setAttribute('aria-hidden', 'false');
        calendarToggleBtn.setAttribute('aria-expanded', 'true');
      }

      function hideCalendarPop(){
        calendarPop.classList.remove('show');
        calendarPop.setAttribute('aria-hidden', 'true');
        calendarToggleBtn.setAttribute('aria-expanded', 'false');
        calendarPop.style.willChange = '';
      }

      function toggleCalendarPop(e){
        e.preventDefault();
        e.stopPropagation();
        if (calendarPop.classList.contains('show')) hideCalendarPop();
        else showCalendarPop();
      }

      function openAppleCalendar(e){
        e.preventDefault();
        e.stopPropagation();
        hideCalendarPop();
        const blob = new Blob([buildICS()], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        window.location.href = url;
        setTimeout(() => URL.revokeObjectURL(url), 8000);
      }

      function openGoogleCalendar(e){
        e.preventDefault();
        e.stopPropagation();
        hideCalendarPop();
        const fullDetails = buildEventDetailsText();
        const webUrl =
          'https://calendar.google.com/calendar/render?action=TEMPLATE'
          + '&text=' + encodeURIComponent(EVENT.title)
          + '&dates=' + encodeURIComponent(EVENT.startUTC + '/' + EVENT.endUTC)
          + '&details=' + encodeURIComponent(fullDetails)
          + '&location=' + encodeURIComponent(EVENT.location)
          + '&sf=true&output=xml';

        if (isAndroid()){
          const intentUrl =
            'intent://calendar.google.com/calendar/render?action=TEMPLATE'
            + '&text=' + encodeURIComponent(EVENT.title)
            + '&dates=' + encodeURIComponent(EVENT.startUTC + '/' + EVENT.endUTC)
            + '&details=' + encodeURIComponent(fullDetails)
            + '&location=' + encodeURIComponent(EVENT.location)
            + '&sf=true&output=xml'
            + '#Intent;scheme=https;package=com.google.android.calendar;S.browser_fallback_url='
            + encodeURIComponent(webUrl)
            + ';end';
          window.location.href = intentUrl;
          return;
        }

        window.location.href = webUrl;
      }
      /* ===== END CALENDAR HELPERS ===== */

      /* ===== START MENU / ZOOM STATE HELPERS ===== */
      function hideHintImmediately(){
        hint.classList.remove('show');
        hint.classList.add('hide');
      }

      function syncActionsVisibility(){
        const visible = body.classList.contains('menu-open') || body.classList.contains('zoom-open');
        actionsWrap.classList.toggle('show', body.classList.contains('menu-open'));
        actionsWrap.setAttribute('aria-hidden', visible ? 'false' : 'true');
        if (!visible) hideCalendarPop();
      }

      function openMenu(){
        hideHintImmediately();
        body.classList.add('menu-open');
        body.classList.remove('zoom-open');
        lb.classList.remove('visible', 'closing');
        document.body.style.overflow = '';
        syncActionsVisibility();
        menuBtn.setAttribute('aria-pressed','true');
        menuBtn.classList.add('on');
      }

      function closeMenu(){
        body.classList.remove('menu-open');
        syncActionsVisibility();
        menuBtn.setAttribute('aria-pressed','false');
        menuBtn.classList.remove('on');
      }

      function closeZoom(){
        if (!lb.classList.contains('visible')){
          body.classList.remove('zoom-open');
          syncActionsVisibility();
          return;
        }

        hideCalendarPop();
        lb.classList.add('closing');

        setTimeout(() => {
          lb.classList.remove('visible');
          body.classList.remove('zoom-open');
          syncActionsVisibility();

          setTimeout(() => {
            lb.classList.remove('closing');
            document.body.style.overflow = '';
          }, 220);
        }, 120);
      }

      function closeAll(){
        hideCalendarPop();
        closeMenu();
        closeZoom();
        document.body.style.overflow = '';
      }

      function openZoom(){
        closeMenu();
        hideHintImmediately();
        body.classList.add('zoom-open');
        syncActionsVisibility();
        lbimg.src = invite.currentSrc || invite.src;
        lb.classList.add('visible');
        document.body.style.overflow = 'hidden';
      }

      function toggleMenu(e){
        e.preventDefault();
        e.stopPropagation();
        if (body.classList.contains('menu-open')) closeMenu();
        else openMenu();
      }
      /* ===== END MENU / ZOOM STATE HELPERS ===== */

      /* ===== START MENU / ZOOM EVENT LISTENERS ===== */
      ['pointerdown', 'click'].forEach(type => {
        actionsWrap.addEventListener(type, (e) => e.stopPropagation());
        calendarPop.addEventListener(type, (e) => e.stopPropagation());
      });

      invite.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (body.classList.contains('menu-open')){
          closeAll();
          return;
        }
        openZoom();
      });

      let lastTap = 0;

      invite.addEventListener('touchend', (e) => {
        if (body.classList.contains('menu-open')) return;
        const now = Date.now();
        if (now - lastTap < 300){
          e.preventDefault();
          e.stopPropagation();
          openZoom();
        }
        lastTap = now;
      }, { passive:false });

      hint.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (body.classList.contains('menu-open')){
          closeAll();
          return;
        }
        openZoom();
      });

      lbimg.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        closeZoom();
      });

      lb.addEventListener('click', (e) => {
        if (e.target === lb) closeZoom();
      });

      zoomCloseBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        closeZoom();
      });

      menuBtn.addEventListener('click', toggleMenu);

      menuCloseBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        closeMenu();
      });

      calendarToggleBtn.addEventListener('click', toggleCalendarPop);
      appleCalBtn.addEventListener('click', openAppleCalendar);
      googleCalBtn.addEventListener('click', openGoogleCalendar);

      actionsWrap.querySelectorAll('.btn').forEach((btn) => {
        if (btn !== calendarToggleBtn){
          btn.addEventListener('click', () => hideCalendarPop());
        }
      });

      window.addEventListener('resize', () => {
        if (calendarPop.classList.contains('show')) positionCalendarPop();
      });

      window.addEventListener('orientationchange', () => {
        setTimeout(() => {
          if (calendarPop.classList.contains('show')) positionCalendarPop();
        }, 50);
      });

      document.addEventListener('pointerdown', (e) => {
        const inside = e.target.closest('#actions, #calendarPop, #menuBtn, #menuCloseBtn, #music, .close, #hint');
        if (!inside) closeAll();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeAll();
      });
      /* ===== END MENU / ZOOM EVENT LISTENERS ===== */

      /* ===== START MUSIC CONTROLS ===== */
      let bgm = null;
      let fadeFrame = null;
      let musicHasStarted = false;
      let suppressNextMusicClick = false;
      const TARGET_VOL = 0.35;
      const SRC = 'assets/bgm_small.mp3?v=37';
      let pref = 'off';

      function createAudio(){
        if (bgm) return bgm;
        bgm = new Audio();
        bgm.src = SRC;
        bgm.loop = true;
        bgm.preload = 'auto';
        bgm.playsInline = true;
        bgm.volume = 0;
        bgm.muted = false;
        bgm.load();
        return bgm;
      }

      function stopFade(){
        if (fadeFrame){
          cancelAnimationFrame(fadeFrame);
          fadeFrame = null;
        }
      }

      function fadeTo(target = TARGET_VOL, ms = 700){
        if (!bgm) return;
        stopFade();
        const start = performance.now();
        const v0 = bgm.volume;

        function step(t){
          const k = Math.min(1, (t - start) / ms);
          bgm.volume = v0 + (target - v0) * k;
          if (k < 1){
            fadeFrame = requestAnimationFrame(step);
          } else {
            fadeFrame = null;
          }
        }

        fadeFrame = requestAnimationFrame(step);
      }

      function setMusicBtn(state){
        const isOn = state === 'on';
        pref = state;
        musicBtn.classList.toggle('on', isOn);
        musicBtn.setAttribute('aria-pressed', isOn ? 'true' : 'false');
        musicBtn.querySelector('.label').textContent = isOn ? 'Music On' : 'Music';
      }

      async function turnMusicOn(){
        createAudio();
        try {
          bgm.muted = false;
          if (bgm.paused) await bgm.play();
          musicHasStarted = true;
          setMusicBtn('on');
          if (bgm.volume < TARGET_VOL){
            fadeTo(TARGET_VOL, 700);
          } else {
            bgm.volume = TARGET_VOL;
          }
        } catch {
          setMusicBtn('off');
        }
      }

      function turnMusicOff(){
        if (!bgm) return;
        stopFade();
        bgm.pause();
        bgm.muted = true;
        bgm.volume = 0;
        setMusicBtn('off');
      }

      async function startMusicFromFirstGesture(e){
        if (musicHasStarted) return;
        if (e && e.target && e.target.closest('#music')){
          suppressNextMusicClick = true;
        }
        await turnMusicOn();
      }

      setMusicBtn('off');
      createAudio();

      ['pointerdown', 'touchstart', 'keydown'].forEach((evt) => {
        window.addEventListener(evt, startMusicFromFirstGesture, {
          once:true,
          passive:true,
          capture:true
        });
      });

      musicBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (suppressNextMusicClick){
          suppressNextMusicClick = false;
          return;
        }

        if (pref === 'on'){
          turnMusicOff();
        } else {
          await turnMusicOn();
        }
      });
      /* ===== END MUSIC CONTROLS ===== */

      /* ===== START INITIAL HINT TIMING ===== */
      setTimeout(() => {
        if (!body.classList.contains('menu-open') && !body.classList.contains('zoom-open')){
          hint.classList.add('show');
        }
      }, 150);

      setTimeout(() => hideHintImmediately(), 5150);
      /* ===== END INITIAL HINT TIMING ===== */
    })();
  </script>
  <!-- ===== END PAGE SCRIPT ===== -->
</body>
</html>
