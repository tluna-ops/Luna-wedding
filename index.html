  <style>
    :root { --fallback:#000; --hint-bg: rgba(255,255,255,.74); --hint-fg:#111; }

    html, body{
      height:100%;
      margin:0;
      background:var(--fallback);
      overflow:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }

    @keyframes fadeBg { from {opacity:0} to {opacity:1} }
    @keyframes fadeCard {
      from {opacity:0; transform:translate(-50%,-48%) scale(.985)}
      to   {opacity:1; transform:translate(-50%,-50%) scale(1)}
    }

    .bg {
      position:fixed;
      inset:0;
      opacity:0;
      animation:fadeBg 900ms ease-out .05s forwards;
    }

    .bg img {
      width:100vw;
      height:100vh;
      object-fit:cover;
      object-position:center;
      user-select:none;
      -webkit-user-drag:none;
    }

    .invite{
      position:fixed;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      width:min(92vw,900px);
      max-height:88vh;
      height:auto;
      border-radius:12px;
      background:#fff;
      box-shadow:0 20px 48px rgba(0,0,0,.25);
      opacity:0;
      animation:fadeCard .75s cubic-bezier(.21,.98,.25,.99) .2s forwards;
      cursor:zoom-in;
      user-select:none;
      -webkit-user-drag:none;
      z-index:1;
    }

    .hint{
      position:fixed;
      left:50%;
      bottom:calc(84px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      padding:8px 12px;
      border-radius:999px;
      background:var(--hint-bg);
      color:var(--hint-fg);
      font-size:13px;
      box-shadow:0 8px 24px rgba(0,0,0,.12);
      z-index:30;
      will-change: opacity, transform;
      border:0;
      appearance:none;
      cursor:pointer;
      opacity:0;
      transition: opacity 600ms ease, transform 600ms ease;
    }
    .hint:focus{ outline:2px solid rgba(0,0,0,.25); outline-offset:2px; }
    .hint.show{ opacity:1; transform:translate(-50%, -4px); }
    .hint.hide{ opacity:0; transform:translate(-50%, 4px); }

    .lightbox{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.6);
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      pointer-events:none;
      z-index:10;
      transition:opacity 280ms ease, background-color 180ms ease;
      -webkit-backdrop-filter: blur(8px) saturate(120%);
      backdrop-filter: blur(8px) saturate(120%);
    }
    .lightbox.visible{ opacity:1; pointer-events:auto; }
    .lightbox.closing{ background:rgba(0,0,0,.95); }

    .lightbox img{
      max-width:94vw;
      max-height:92vh;
      border-radius:14px;
      box-shadow:0 24px 64px rgba(0,0,0,.6);
      transform:scale(.96);
      transition:transform 280ms cubic-bezier(.23,1,.32,1);
      touch-action:pinch-zoom;
    }
    .lightbox.visible img{ transform:scale(1); }
    .lightbox.closing img{ transform:scale(.98); }

    .close{
      position:fixed;
      top:calc(12px + env(safe-area-inset-top));
      right:calc(12px + env(safe-area-inset-right));
      width:44px;
      height:44px;
      border:0;
      border-radius:999px;
      background:#fff;
      color:#000;
      font-size:22px;
      line-height:1;
      cursor:pointer;
      opacity:0;
      transform:scale(.85);
      transition:opacity 260ms ease .1s, transform 260ms ease .1s;
    }
    .lightbox.visible .close{ opacity:1; transform:scale(1); }

    .actions{
      position:fixed;
      left:50%;
      bottom:calc(16px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      z-index:15;
      display:flex;
      gap:8px;
      flex-wrap:nowrap;
      overflow-x:auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width:none;
      max-width:min(92vw, 980px);
      padding:0 8px;
      opacity:0;
      pointer-events:none;
      transition:opacity .28s ease, transform .28s ease, bottom .28s ease;
    }
    .actions::-webkit-scrollbar{ display:none; }

    .actions.show{
      bottom:calc(84px + env(safe-area-inset-bottom));
      opacity:1;
      pointer-events:auto;
      transform:translateX(-50%) translateY(-4px);
      z-index:30;
    }

    .lightbox.visible + .actions{
      bottom:calc(16px + env(safe-area-inset-bottom));
      opacity:1;
      pointer-events:auto;
      transform:translateX(-50%) translateY(-4px);
      z-index:30;
    }

    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.6);
      color:#fff;
      background:rgba(0,0,0,.45);
      padding:10px 14px;
      border-radius:999px;
      font-size:14px;
      backdrop-filter:blur(6px);
      -webkit-backdrop-filter:blur(6px);
      box-shadow:0 8px 24px rgba(0,0,0,.18);
      cursor:pointer;
      flex:0 0 auto;
      white-space:nowrap;
      text-decoration:none;
    }
    .btn:hover, .btn:focus, .btn:active{ text-decoration:none; }

    .dock{
      position:fixed;
      left:12px;
      bottom:calc(12px + env(safe-area-inset-bottom));
      display:flex;
      align-items:center;
      gap:8px;
      z-index:20;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.5);
      background:rgba(0,0,0,.40);
      color:#fff;
      font-size:14px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      box-shadow:0 8px 24px rgba(0,0,0,.18);
      cursor:pointer;
      user-select:none;
      transition:opacity .25s ease, transform .25s ease, background .25s ease;
    }
    .pill:hover{ transform:translateY(-1px); background:rgba(0,0,0,.5); }
    .pill .dot{ width:8px; height:8px; border-radius:999px; background:#ff4d4f; }
    .pill.on .dot{ background:#3bd16f; }
    .pill .label{ letter-spacing:.2px; }

    .lightbox.visible ~ .dock #menuBtn{
      opacity:0;
      pointer-events:none;
      transform:translateY(6px);
    }

    @media (max-width: 430px){
      .actions{
        overflow-x: visible;
        flex-wrap: wrap;
        justify-content: center;
        row-gap: 8px;
        max-width: 92vw;
        padding: 0 12px;
      }
      .btn{
        flex: 1 1 calc(50% - 8px);
        text-align: center;
      }
    }

    @media (max-width: 340px){
      .btn{ flex: 1 1 100%; }
    }

    @media (prefers-reduced-motion: reduce){
      .bg, .invite, .hint{ animation-duration:.01s; }
    }
  </style>
</head>

<body>
  <div class="bg" aria-hidden="true">
    <img src="assets/bg.jpg?v=37" alt="">
  </div>

  <img id="invite" class="invite" src="assets/weddinginvite.png?v=1" alt="Wedding invitation">

  <button id="hint" class="hint" type="button" aria-label="Tap to zoom">Tap to zoom</button>

  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <img id="lbimg" alt="Wedding invitation (zoomed)">
    <button class="close" aria-label="Close">×</button>
  </div>

  <!-- Main action buttons -->
  <div id="actions" class="actions" aria-hidden="true">
    <a
      id="rsvpBtn"
      class="btn"
      aria-label="RSVP"
      href="mailto:rsvp@luna.wedding?subject=RSVP%3A%20Luna%20Wedding&body=Hello%20Toby%20%26%20Michelle%2C%0A%0AWe%27re%20delighted%20to%20RSVP%20for%20June%206%2C%202026.%0A%0ANames%3A%20%0ANumber%20of%20Guests%3A%20%0ADietary%20notes%3A%20%0A%0AWith%20love%2C%0A"
      rel="noopener"
    >RSVP</a>

    <a
      id="calendarBtn"
      class="btn"
      aria-label="Add to Calendar"
      href="assets/wedding.ics"
      download
      rel="noopener"
    >Add to Calendar</a>

    <!-- Buttons to other pages -->
    <a id="registryBtn" class="btn" aria-label="Registry" href="registry.html">Registry</a>
    <a id="faqBtn" class="btn" aria-label="FAQ" href="faq.html">FAQ</a>

    <a
      id="askBtn"
      class="btn"
      aria-label="Contact the Couple"
      href="mailto:hello@luna.wedding?subject=Question%20about%20Luna%20Wedding%20%E2%80%94%20June%206%2C%202026&body=Hello%20Toby%20%26%20Michelle%2C%0A%0AMy%20name%3A%0APhone%20(optional)%3A%0A%0AMy%20question%3A%0A%0AThanks!%0A%E2%80%94%20"
      rel="noopener"
    >Contact the Couple</a>
  </div>

  <div class="dock">
    <button id="music" class="pill" aria-pressed="false" aria-label="Toggle music">
      <span class="dot" aria-hidden="true"></span>
      <span class="label">Music</span>
    </button>
    <button id="menuBtn" class="pill" aria-pressed="false" aria-label="Toggle menu">
      <span class="label">Menu</span>
    </button>
  </div>

  <noscript><style>.hint{display:none}</style></noscript>

  <script>
    (function(){
      const invite = document.getElementById('invite');
      const hint = document.getElementById('hint');
      const lb = document.getElementById('lightbox');
      const lbimg = document.getElementById('lbimg');
      const closeBtn = lb.querySelector('.close');
      const actionsWrap = document.getElementById('actions');
      const musicBtn = document.getElementById('music');
      const menuBtn = document.getElementById('menuBtn');

      function showActions(){
        actionsWrap.classList.add('show');
        actionsWrap.setAttribute('aria-hidden','false');
        menuBtn.setAttribute('aria-pressed','true');
        menuBtn.classList.add('on');
      }

      function hideActions(){
        actionsWrap.classList.remove('show');
        actionsWrap.setAttribute('aria-hidden','true');
        menuBtn.setAttribute('aria-pressed','false');
        menuBtn.classList.remove('on');
      }

      function toggleActions(e){
        e?.stopPropagation();
        if (actionsWrap.classList.contains('show')) hideActions();
        else showActions();
      }

      function openLB(){
        hideActions();
        lbimg.src = invite.src;
        lb.classList.add('visible');
        document.body.style.overflow = 'hidden';
        if (hint) hint.classList.add('hide');
        unlockAudio();
      }

      function closeLB(){
        lb.classList.add('closing');
        setTimeout(() => {
          lb.classList.remove('visible');
          setTimeout(() => {
            lb.classList.remove('closing');
            document.body.style.overflow = '';
          }, 300);
        }, 120);
      }

      invite.addEventListener('click', openLB, { passive:true });

      let lastTap = 0;
      invite.addEventListener('touchend', () => {
        const now = Date.now();
        if (now - lastTap < 300) openLB();
        lastTap = now;
      }, { passive:true });

      lb.addEventListener('click', (e) => {
        if (e.target === lb) closeLB();
      });

      closeBtn.addEventListener('click', closeLB);

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeLB();
      });

      hint.addEventListener('click', openLB, { passive:true });

      document.addEventListener('click', (e) => {
        const withinMenu = e.target.closest('#menuBtn');
        const withinActions = e.target.closest('#actions');
        const withinLB = e.target.closest('#lightbox');
        if (!withinMenu && !withinActions && !withinLB){
          hideActions();
        }
      });

      menuBtn.addEventListener('click', toggleActions);

      let bgm = null, fadedIn = false;
      const TARGET_VOL = 0.35;
      const SRC = 'assets/bgm_small.mp3?v=37';

      function createAudio(){
        if (bgm) return bgm;
        bgm = new Audio();
        bgm.src = SRC;
        bgm.loop = true;
        bgm.preload = 'auto';
        bgm.playsInline = true;
        bgm.volume = 0;
        return bgm;
      }

      function fadeTo(target = TARGET_VOL, ms = 1000){
        if (!bgm) return;
        const start = performance.now();
        const v0 = bgm.volume;
        function step(t){
          const k = Math.min(1, (t - start) / ms);
          bgm.volume = v0 + (target - v0) * k;
          if (k < 1) requestAnimationFrame(step);
          else fadedIn = true;
        }
        requestAnimationFrame(step);
      }

      async function tryAutoPlayNow(){
        createAudio();
        try {
          bgm.muted = false;
          await bgm.play();
          if (bgm.volume === 0) fadeTo(TARGET_VOL, 1000);
        } catch {
          bgm.muted = true;
          bgm.play().catch(() => {});
        }
      }

      async function unlockAudio(){
        createAudio();
        try {
          bgm.muted = false;
          if (bgm.paused) await bgm.play();
          if (!fadedIn) {
            bgm.volume = 0;
            fadeTo(TARGET_VOL, 1000);
          }
        } catch {
          setTimeout(async () => {
            try {
              bgm.muted = false;
              if (bgm.paused) await bgm.play();
              if (!fadedIn) {
                bgm.volume = 0;
                fadeTo(TARGET_VOL, 1000);
              }
            } catch(e){}
          }, 150);
        }
      }

      window.addEventListener('load', tryAutoPlayNow);
      ['pointerdown','click','touchend','keydown'].forEach((evt) => {
        window.addEventListener(evt, unlockAudio, { once:true, passive:true });
      });

      let pref = localStorage.getItem('music') || 'on';
      function setMusicBtn(state){
        musicBtn.classList.toggle('on', state === 'on');
        musicBtn.setAttribute('aria-pressed', state === 'on' ? 'true' : 'false');
      }
      setMusicBtn(pref);

      musicBtn.addEventListener('click', () => {
        createAudio();
        pref = (pref === 'on') ? 'off' : 'on';
        localStorage.setItem('music', pref);
        setMusicBtn(pref);

        if (pref === 'on'){
          bgm.muted = false;
          if (bgm.paused) bgm.play().catch(() => {});
          if (!fadedIn) {
            bgm.volume = 0;
            fadeTo(TARGET_VOL, 1000);
          } else {
            bgm.volume = TARGET_VOL;
          }
        } else {
          bgm.muted = true;
        }
      });

      setTimeout(() => { if (hint) hint.classList.add('show'); }, 150);
      setTimeout(() => { if (hint) hint.classList.add('hide'); }, 5150);
    })();
  </script>
</body>
