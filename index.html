  <style>
    :root { --fallback:#000; --hint-bg: rgba(255,255,255,.74); --hint-fg:#111; }

    html, body{
      height:100%;
      margin:0;
      background:var(--fallback);
      overflow:hidden;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    }

    @keyframes fadeBg { from {opacity:0} to {opacity:1} }
    @keyframes fadeCard {
      from {opacity:0; transform:translate(-50%,-48%) scale(.985)}
      to   {opacity:1; transform:translate(-50%,-50%) scale(1)}
    }

    .bg { position:fixed; inset:0; opacity:0; animation:fadeBg 900ms ease-out .05s forwards; }
    .bg img { width:100vw; height:100vh; object-fit:cover; object-position:center; user-select:none; -webkit-user-drag:none; }

    .invite{
      position:fixed; left:50%; top:50%;
      transform:translate(-50%,-50%);
      max-width:min(92vw,900px); max-height:88vh;
      width:auto; height:auto; display:block;
      border-radius:12px; background:#fff;
      box-shadow:0 20px 48px rgba(0,0,0,.25);
      opacity:0; animation:fadeCard .75s cubic-bezier(.21,.98,.25,.99) .2s forwards;
      cursor:zoom-in; user-select:none; -webkit-user-drag:none; z-index:1;
    }

    .hint{
      position:fixed; left:50%;
      bottom:calc(84px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      padding:8px 12px; border-radius:999px;
      background:var(--hint-bg); color:var(--hint-fg); font-size:13px;
      box-shadow:0 8px 24px rgba(0,0,0,.12);
      z-index:30; border:0; cursor:pointer;
      opacity:0; transition: opacity 600ms ease, transform 600ms ease;
    }
    .hint.show{ opacity:1; transform:translate(-50%, -4px); }
    .hint.hide{ opacity:0; transform:translate(-50%, 4px); }

    .lightbox{
      position:fixed; inset:0; background:rgba(0,0,0,.6);
      display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none; z-index:10;
      transition:opacity 280ms ease, background-color 180ms ease;
      -webkit-backdrop-filter: blur(8px) saturate(120%);
      backdrop-filter: blur(8px) saturate(120%);
    }
    .lightbox.visible{ opacity:1; pointer-events:auto; }
    .lightbox.closing{ background:rgba(0,0,0,.95); }

    .lightbox img{
      max-width:94vw; max-height:92vh; border-radius:14px;
      box-shadow:0 24px 64px rgba(0,0,0,.6);
      transform:scale(.96);
      transition:transform 280ms cubic-bezier(.23,1,.32,1);
      touch-action:pinch-zoom;
      cursor:zoom-out;
    }
    .lightbox.visible img{ transform:scale(1); }

    .close, .menu-close{
      position:fixed;
      top:calc(12px + env(safe-area-inset-top));
      right:calc(12px + env(safe-area-inset-right));
      width:44px; height:44px;
      border:0; border-radius:999px;
      background:#fff; color:#000;
      font-size:22px; line-height:1; cursor:pointer;
      opacity:0; pointer-events:none; transform:scale(.85);
      transition:opacity 260ms ease .1s, transform 260ms ease .1s;
    }
    .close{ z-index:45; }
    .menu-close{ z-index:34; background:rgba(255,255,255,.92); }

    .lightbox.visible .close{ opacity:1; pointer-events:auto; transform:scale(1); }
    body.menu-open .menu-close{ opacity:1; pointer-events:auto; transform:scale(1); }
    body.zoom-open .menu-close{ opacity:0; pointer-events:none; }

    .actions{
      position:fixed; left:50%;
      bottom:calc(16px + env(safe-area-inset-bottom));
      transform:translateX(-50%);
      z-index:30;
      display:flex; gap:8px; flex-wrap:nowrap; overflow-x:auto;
      -webkit-overflow-scrolling: touch; scrollbar-width:none;
      max-width:min(92vw,980px); padding:0 8px;
      opacity:0; pointer-events:none;
      transition:opacity .28s ease, transform .28s ease, bottom .28s ease;
    }
    .actions::-webkit-scrollbar{ display:none; }

    .actions.show{
      bottom:calc(84px + env(safe-area-inset-bottom));
      opacity:1; pointer-events:auto;
      transform:translateX(-50%) translateY(-4px);
    }

    body.zoom-open .actions{
      bottom:calc(16px + env(safe-area-inset-bottom));
      opacity:1; pointer-events:auto;
      transform:translateX(-50%) translateY(-4px);
    }

    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.6);
      color:#fff; background:rgba(0,0,0,.45);
      padding:10px 14px; border-radius:999px;
      font-size:14px; line-height:1.15;
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      box-shadow:0 8px 24px rgba(0,0,0,.18);
      cursor:pointer; flex:0 0 auto; white-space:nowrap; text-decoration:none;
    }

    .calendar-pop{
      position:fixed;
      left:0; top:0;
      transform:translate(-9999px,-9999px);
      display:flex; flex-direction:column; gap:6px;
      z-index:80;

      opacity:0;
      visibility:hidden;
      pointer-events:none;

      transition: opacity .16s ease;
    }
    .calendar-pop.show{
      opacity:1;
      visibility:visible;
      pointer-events:auto;
    }
    .calendar-pop .btn{
      text-align:center;
      background:rgba(0,0,0,.78);
      border-color:rgba(255,255,255,.8);
      min-width:180px;
    }

    .dock{
      position:fixed; left:12px;
      bottom:calc(12px + env(safe-area-inset-bottom));
      display:flex; align-items:center; gap:8px; z-index:20;
      transition:opacity .2s ease, transform .2s ease;
    }

    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 12px; border-radius:999px;
      border:1px solid rgba(255,255,255,.5);
      background:rgba(0,0,0,.40); color:#fff; font-size:14px;
      backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
      box-shadow:0 8px 24px rgba(0,0,0,.18);
      cursor:pointer; user-select:none;
      transition:opacity .25s ease, transform .25s ease, background .25s ease;
    }
    .pill .dot{ width:8px; height:8px; border-radius:999px; background:#ff4d4f; }
    .pill.on .dot{ background:#3bd16f; }

    body.zoom-open .dock{
      opacity:0; pointer-events:none; transform:translateY(8px);
    }

    @media (max-width: 430px){
      .actions{
        overflow-x:visible; flex-wrap:wrap; justify-content:center;
        row-gap:8px; max-width:92vw; padding:0 12px;
      }
      .btn{ flex:1 1 calc(50% - 8px); text-align:center; }
      .calendar-pop .btn{ min-width:160px; }
    }
    @media (max-width: 340px){
      .btn{ flex:1 1 100%; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><img src="assets/bg.jpg?v=37" alt=""></div>

  <img id="invite" class="invite" src="assets/weddinginvite.png?v=14" alt="Wedding invitation">
  <button id="hint" class="hint" type="button" aria-label="Tap to zoom">Tap to zoom</button>

  <div id="lightbox" class="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
    <img id="lbimg" alt="Wedding invitation (zoomed)">
    <button class="close" aria-label="Close zoom">×</button>
  </div>

  <button id="menuCloseBtn" class="menu-close" aria-label="Close menu">×</button>

  <div id="actions" class="actions" aria-hidden="true">
    <a id="rsvpBtn" class="btn"
      href="mailto:rsvp@luna.wedding?subject=RSVP%3A%20Luna%20Wedding&body=Hello%20Toby%20%26%20Michelle%2C%0A%0AWe%27re%20delighted%20to%20RSVP%20for%20June%206%2C%202026.%0A%0ANames%3A%20%0ANumber%20of%20Guests%3A%20%0ADietary%20notes%3A%20%0A%0AWith%20love%2C%0A"
      rel="noopener">RSVP</a>

    <button id="calendarToggleBtn" class="btn" type="button" aria-expanded="false" aria-controls="calendarPop">
      Add to Calendar
    </button>

    <a id="registryBtn" class="btn" href="registry.html">Registry</a>
    <a id="faqBtn" class="btn" href="faq.html">FAQ</a>

    <a id="askBtn" class="btn"
      href="mailto:hello@luna.wedding?subject=Question%20about%20Luna%20Wedding%20%E2%80%94%20June%206%2C%202026&body=Hello%20Toby%20%26%20Michelle%2C%0A%0AMy%20name%3A%0APhone%20(optional)%3A%0A%0AMy%20question%3A%0A%0AThanks!%0A%E2%80%94%20"
      rel="noopener">Contact the Couple</a>
  </div>

  <div id="calendarPop" class="calendar-pop" aria-hidden="true">
    <button id="appleCalBtn" class="btn" type="button">Apple Calendar</button>
    <button id="googleCalBtn" class="btn" type="button">Google Calendar</button>
  </div>

  <div class="dock">
    <button id="music" class="pill" aria-pressed="false" aria-label="Toggle music">
      <span class="dot" aria-hidden="true"></span><span class="label">Music</span>
    </button>
    <button id="menuBtn" class="pill" aria-pressed="false" aria-label="Toggle menu">
      <span class="label">Menu</span>
    </button>
  </div>

  <script>
    (function(){
      const body = document.body;
      const invite = document.getElementById('invite');
      const hint = document.getElementById('hint');
      const lb = document.getElementById('lightbox');
      const lbimg = document.getElementById('lbimg');
      const zoomCloseBtn = lb.querySelector('.close');

      const actionsWrap = document.getElementById('actions');
      const menuBtn = document.getElementById('menuBtn');
      const menuCloseBtn = document.getElementById('menuCloseBtn');
      const musicBtn = document.getElementById('music');

      const calendarToggleBtn = document.getElementById('calendarToggleBtn');
      const calendarPop = document.getElementById('calendarPop');
      const appleCalBtn = document.getElementById('appleCalBtn');
      const googleCalBtn = document.getElementById('googleCalBtn');

      const EVENT = {
        title: "Toby and Michelle's Wedding",
        description: "Toby and Michelle's wedding. Visit luna.wedding for more details.",
        venueName: "Carne Mare – Seaport",
        location: "89 South St, New York, NY 10038",
        mapsUrl: "https://maps.google.com/?q=89%20South%20St%2C%20New%20York%2C%20NY%2010038",
        startUTC: '20260606T230000Z',
        endUTC:   '20260607T020000Z'
      };

      function isAndroid(){ return /Android/i.test(navigator.userAgent); }

      function fold(line){
        const CRLF = '\r\n';
        if (line.length <= 74) return line;
        let out = '';
        while (line.length > 74){
          out += line.slice(0,74) + CRLF + ' ';
          line = line.slice(74);
        }
        return out + line;
      }

      function buildICSDescription(){
        return [
          EVENT.description,
          `Venue: ${EVENT.venueName}`,
          `Map: ${EVENT.mapsUrl}`
        ].join('\\n');
      }

      function buildICS(){
        const CRLF = '\r\n';
        return [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//luna.wedding//Wedding//EN',
          'CALSCALE:GREGORIAN',
          'METHOD:PUBLISH',
          'BEGIN:VEVENT',
          `UID:${(crypto.randomUUID ? crypto.randomUUID() : ('luna-' + Date.now()))}@luna.wedding`,
          `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').split('.')[0]}Z`,
          `DTSTART:${EVENT.startUTC}`,
          `DTEND:${EVENT.endUTC}`,
          fold(`SUMMARY:${EVENT.title}`),
          fold(`DESCRIPTION:${buildICSDescription()}`),
          fold(`LOCATION:${EVENT.location}`),
          'END:VEVENT',
          'END:VCALENDAR',
          ''
        ].join(CRLF);
      }

      function positionCalendarPop(){
        const r = calendarToggleBtn.getBoundingClientRect();
        const popW = (window.innerWidth <= 430) ? 170 : 190;
        const gap = 8;

        let left = r.left + (r.width / 2) - (popW / 2);
        left = Math.max(12, Math.min(left, window.innerWidth - popW - 12));

        const top = Math.max(12, r.top - 92 - gap);

        calendarPop.style.left = left + 'px';
        calendarPop.style.top = top + 'px';
        calendarPop.style.transform = 'translate(0,0)';
      }

      function showCalendarPop(){
        positionCalendarPop();
        calendarPop.style.willChange = 'opacity';
        calendarPop.classList.add('show');
        calendarPop.setAttribute('aria-hidden', 'false');
        calendarToggleBtn.setAttribute('aria-expanded', 'true');
      }

      function hideCalendarPop(){
        calendarPop.classList.remove('show');
        calendarPop.setAttribute('aria-hidden', 'true');
        calendarToggleBtn.setAttribute('aria-expanded', 'false');
        calendarPop.style.willChange = '';
      }

      function toggleCalendarPop(e){
        e.preventDefault();
        e.stopPropagation();
        if (calendarPop.classList.contains('show')) hideCalendarPop();
        else showCalendarPop();
      }

      function openAppleCalendar(e){
        e.preventDefault();
        e.stopPropagation();
        hideCalendarPop();

        const blob = new Blob([buildICS()], { type: 'text/calendar;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        window.location.href = url;
        setTimeout(() => URL.revokeObjectURL(url), 8000);
      }

      function openGoogleCalendar(e){
        e.preventDefault();
        e.stopPropagation();
        hideCalendarPop();

        const fullDetails = [
          EVENT.description,
          `Venue: ${EVENT.venueName}`,
          `Map: ${EVENT.mapsUrl}`
        ].join('\n');

        const webUrl =
          'https://calendar.google.com/calendar/render?action=TEMPLATE'
          + '&text=' + encodeURIComponent(EVENT.title)
          + '&dates=' + encodeURIComponent(EVENT.startUTC + '/' + EVENT.endUTC)
          + '&details=' + encodeURIComponent(fullDetails)
          + '&location=' + encodeURIComponent(EVENT.location)
          + '&sf=true&output=xml';

        if (isAndroid()) {
          const intentUrl =
            'intent://calendar.google.com/calendar/render?action=TEMPLATE'
            + '&text=' + encodeURIComponent(EVENT.title)
            + '&dates=' + encodeURIComponent(EVENT.startUTC + '/' + EVENT.endUTC)
            + '&details=' + encodeURIComponent(fullDetails)
            + '&location=' + encodeURIComponent(EVENT.location)
            + '&sf=true&output=xml'
            + '#Intent;scheme=https;package=com.google.android.calendar;S.browser_fallback_url='
            + encodeURIComponent(webUrl)
            + ';end';
          window.location.href = intentUrl;
          return;
        }

        window.location.href = webUrl;
      }

      function syncActionsVisibility(){
        const visible = body.classList.contains('menu-open') || body.classList.contains('zoom-open');
        actionsWrap.classList.toggle('show', body.classList.contains('menu-open'));
        actionsWrap.setAttribute('aria-hidden', visible ? 'false' : 'true');
        if (!visible) hideCalendarPop();
      }

      function openMenu(){
        body.classList.add('menu-open');
        body.classList.remove('zoom-open');
        lb.classList.remove('visible', 'closing');
        document.body.style.overflow = '';
        syncActionsVisibility();
        menuBtn.setAttribute('aria-pressed','true');
        menuBtn.classList.add('on');
      }

      function closeMenu(){
        body.classList.remove('menu-open');
        syncActionsVisibility();
        menuBtn.setAttribute('aria-pressed','false');
        menuBtn.classList.remove('on');
      }

      function closeZoom(){
        if (!lb.classList.contains('visible')) {
          body.classList.remove('zoom-open');
          syncActionsVisibility();
          return;
        }
        hideCalendarPop();
        lb.classList.add('closing');
        setTimeout(() => {
          lb.classList.remove('visible');
          body.classList.remove('zoom-open');
          syncActionsVisibility();
          setTimeout(() => {
            lb.classList.remove('closing');
            document.body.style.overflow = '';
          }, 220);
        }, 120);
      }

      function closeAll(){
        hideCalendarPop();
        closeMenu();
        closeZoom();
        document.body.style.overflow = '';
      }

      function openZoom(){
        closeMenu();
        body.classList.add('zoom-open');
        syncActionsVisibility();
        lbimg.src = invite.currentSrc || invite.src;
        lb.classList.add('visible');
        document.body.style.overflow = 'hidden';
        hint.classList.add('hide');
        unlockAudio();
      }

      function toggleMenu(e){
        e.preventDefault();
        e.stopPropagation();
        if (body.classList.contains('menu-open')) closeMenu();
        else openMenu();
      }

      ['pointerdown', 'click'].forEach(type => {
        actionsWrap.addEventListener(type, (e) => e.stopPropagation());
        calendarPop.addEventListener(type, (e) => e.stopPropagation());
      });

      invite.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (body.classList.contains('menu-open')) {
          closeAll();
          return;
        }
        openZoom();
      });

      let lastTap = 0;
      invite.addEventListener('touchend', (e) => {
        if (body.classList.contains('menu-open')) return;
        const now = Date.now();
        if (now - lastTap < 300) {
          e.preventDefault();
          e.stopPropagation();
          openZoom();
        }
        lastTap = now;
      }, { passive:false });

      hint.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (body.classList.contains('menu-open')) {
          closeAll();
          return;
        }
        openZoom();
      });

      lbimg.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        closeZoom();
      });

      lb.addEventListener('click', (e) => {
        if (e.target === lb) closeZoom();
      });

      zoomCloseBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        closeZoom();
      });

      menuBtn.addEventListener('click', toggleMenu);
      menuCloseBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        closeMenu();
      });

      calendarToggleBtn.addEventListener('click', toggleCalendarPop);
      appleCalBtn.addEventListener('click', openAppleCalendar);
      googleCalBtn.addEventListener('click', openGoogleCalendar);

      actionsWrap.querySelectorAll('.btn').forEach((btn) => {
        if (btn !== calendarToggleBtn) {
          btn.addEventListener('click', () => hideCalendarPop());
        }
      });

      window.addEventListener('resize', () => {
        if (calendarPop.classList.contains('show')) positionCalendarPop();
      });
      window.addEventListener('orientationchange', () => {
        setTimeout(() => {
          if (calendarPop.classList.contains('show')) positionCalendarPop();
        }, 50);
      });

      document.addEventListener('pointerdown', (e) => {
        const inside = e.target.closest('#actions, #calendarPop, #menuBtn, #menuCloseBtn, #music, .close, #hint');
        if (!inside) closeAll();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeAll();
      });

      let bgm = null;
      let fadedIn = false;
      const TARGET_VOL = 0.35;
      const SRC = 'assets/bgm_small.mp3?v=37';

      function createAudio(){
        if (bgm) return bgm;
        bgm = new Audio();
        bgm.src = SRC;
        bgm.loop = true;
        bgm.preload = 'auto';
        bgm.playsInline = true;
        bgm.volume = 0;
        bgm.load();
        return bgm;
      }

      function fadeTo(target = TARGET_VOL, ms = 900){
        if (!bgm) return;
        const start = performance.now();
        const v0 = bgm.volume;
        function step(t){
          const k = Math.min(1, (t - start) / ms);
          bgm.volume = v0 + (target - v0) * k;
          if (k < 1) requestAnimationFrame(step);
          else fadedIn = true;
        }
        requestAnimationFrame(step);
      }

      async function tryAutoPlayNow(){
        createAudio();
        try {
          bgm.muted = false;
          await bgm.play();
          if (!fadedIn) fadeTo(TARGET_VOL, 900);
        } catch { bgm.pause(); }
      }

      async function unlockAudio(){
        createAudio();
        try {
          bgm.muted = false;
          if (bgm.paused) await bgm.play();
          if (!fadedIn) { bgm.volume = 0; fadeTo(TARGET_VOL, 900); }
        } catch {
          setTimeout(async () => {
            try {
              bgm.muted = false;
              if (bgm.paused) await bgm.play();
              if (!fadedIn) { bgm.volume = 0; fadeTo(TARGET_VOL, 900); }
            } catch {}
          }, 120);
        }
      }

      document.addEventListener('DOMContentLoaded', () => {
        createAudio();
        tryAutoPlayNow();
      });

      ['pointerdown','touchstart','touchend','click','keydown'].forEach((evt) => {
        window.addEventListener(evt, unlockAudio, { once:true, passive:true });
      });

      let pref = localStorage.getItem('music') || 'on';
      function setMusicBtn(state){
        musicBtn.classList.toggle('on', state === 'on');
        musicBtn.setAttribute('aria-pressed', state === 'on' ? 'true' : 'false');
      }
      setMusicBtn(pref);

      musicBtn.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        createAudio();
        pref = (pref === 'on') ? 'off' : 'on';
        localStorage.setItem('music', pref);
        setMusicBtn(pref);

        if (pref === 'on'){
          try {
            bgm.muted = false;
            if (bgm.paused) await bgm.play();
            if (!fadedIn) { bgm.volume = 0; fadeTo(TARGET_VOL, 900); }
            else { bgm.volume = TARGET_VOL; }
          } catch {}
        } else {
          bgm.muted = true;
          bgm.pause();
        }
      });

      setTimeout(() => hint.classList.add('show'), 150);
      setTimeout(() => hint.classList.add('hide'), 5150);
    })();
  </script>
</body>
