<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Luna Wedding — June 6, 2026</title>
  <link rel="canonical" href="https://luna.wedding/" />

  <meta name="title" content="Luna Wedding — June 6, 2026" />
  <meta name="description" content="Tobias and Michelle are getting married on Saturday, June 6, 2026 at Carne Mare in New York City." />

  <meta property="og:locale" content="en_US" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Luna Wedding" />
  <meta property="og:title" content="Luna Wedding — June 6, 2026" />
  <meta property="og:description" content="Tobias and Michelle are getting married on Saturday, June 6, 2026." />
  <meta property="og:image" content="https://luna.wedding/assets/weddinginvite.png?v=15" />
  <meta property="og:url" content="https://luna.wedding/" />

  <!-- This matches the Venue / Registry / FAQ mobile browser chrome -->
  <meta name="theme-color" content="#746e6e" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="preload" as="image" href="assets/bg.jpg?v=37" />
  <link rel="preload" as="image" href="assets/weddinginvite.png?v=15" />

  <style>
    :root {
      --chrome: #746e6e;
      --ink: #3f3437;
      --muted: #6f6064;
      --rose: #c58790;
      --rose-dark: #b6747e;
      --rose-soft: #e7c0c4;
      --cream: #fffaf4;
      --card: rgba(255, 250, 246, 0.88);
      --line: rgba(136, 91, 99, 0.22);
      --shadow: 0 18px 60px rgba(42, 31, 33, 0.28);
      --radius: 34px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      min-height: 100%;
      background: var(--chrome);
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: var(--chrome);
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Avenir Next", Avenir, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    /*
      IMPORTANT:
      The background lives directly on body and reaches behind the iOS address/status bar.
      Do not add a cream/pink fixed overlay at the top.
    */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        linear-gradient(rgba(55, 48, 48, 0.43), rgba(55, 48, 48, 0.43)),
        url("assets/bg.jpg?v=37") center / cover no-repeat;
      filter: blur(18px);
      transform: scale(1.08);
      transform-origin: center;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 18%, rgba(255, 244, 240, 0.28), transparent 34%),
        rgba(76, 62, 62, 0.13);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .page {
      min-height: 100svh;
      padding:
        calc(env(safe-area-inset-top) + 28px)
        24px
        calc(env(safe-area-inset-bottom) + 116px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: transparent;
    }

    .invite-card {
      width: min(92vw, 760px);
      max-height: calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 190px);
      border-radius: 22px;
      overflow: hidden;
      background: rgba(255, 252, 234, 0.96);
      box-shadow: var(--shadow);
      position: relative;
    }

    .invite-wrap {
      position: relative;
      width: 100%;
    }

    .invite-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .invite-actions {
      position: absolute;
      left: 50%;
      bottom: 2.4%;
      transform: translateX(-50%);
      width: min(70%, 430px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 12px;
      z-index: 2;
    }

    .invite-actions .wide {
      grid-column: 1 / -1;
    }

    .pill {
      min-height: 54px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.48);
      background: rgba(221, 178, 181, 0.92);
      color: #332b2e;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.42),
        0 10px 28px rgba(68, 45, 50, 0.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 22px;
      font-weight: 800;
      font-size: clamp(16px, 3vw, 24px);
      line-height: 1;
      letter-spacing: 0.08em;
      text-align: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .pill:hover {
      background: rgba(211, 161, 166, 0.96);
    }

    .floating-controls {
      position: fixed;
      left: 24px;
      right: 24px;
      bottom: calc(env(safe-area-inset-bottom) + 22px);
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: flex-start;
      z-index: 30;
      pointer-events: none;
    }

    .control-btn {
      pointer-events: auto;
      min-height: 58px;
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 999px;
      padding: 0 26px;
      background: rgba(191, 124, 134, 0.88);
      color: #fff;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        0 12px 30px rgba(39, 28, 31, 0.2);
      font: inherit;
      font-weight: 850;
      font-size: clamp(15px, 3.4vw, 22px);
      letter-spacing: 0.07em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .control-btn .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: currentColor;
      display: inline-block;
      opacity: 0.9;
    }

    .menu-panel {
      position: fixed;
      inset: 0;
      z-index: 50;
      padding:
        calc(env(safe-area-inset-top) + 26px)
        24px
        calc(env(safe-area-inset-bottom) + 32px);
      display: none;
      background: transparent;
    }

    .menu-panel.is-open {
      display: block;
    }

    .menu-panel::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(rgba(55, 48, 48, 0.43), rgba(55, 48, 48, 0.43)),
        url("assets/bg.jpg?v=37") center / cover no-repeat;
      filter: blur(18px);
      transform: scale(1.08);
    }

    .menu-panel::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: rgba(76, 62, 62, 0.13);
    }

    .close-menu {
      position: absolute;
      top: calc(env(safe-area-inset-top) + 28px);
      right: 24px;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      border: 1px solid rgba(195, 147, 151, 0.28);
      background: rgba(255, 250, 246, 0.92);
      color: var(--ink);
      font-size: 34px;
      line-height: 1;
      display: grid;
      place-items: center;
      box-shadow: 0 12px 32px rgba(45, 31, 34, 0.16);
      cursor: pointer;
    }

    .menu-links {
      width: min(92vw, 760px);
      margin: 128px auto 0;
      display: grid;
      gap: 16px;
    }

    .menu-links a {
      min-height: 72px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.52);
      background: rgba(221, 178, 181, 0.92);
      color: #342c2f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 850;
      font-size: clamp(18px, 4vw, 28px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.42),
        0 12px 30px rgba(68, 45, 50, 0.16);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (min-width: 760px) {
      .invite-actions {
        bottom: 2.8%;
        gap: 14px;
      }

      .pill {
        min-height: 62px;
      }

      .floating-controls {
        left: 34px;
        bottom: calc(env(safe-area-inset-bottom) + 30px);
      }
    }

    @media (max-width: 520px) {
      .page {
        justify-content: flex-start;
        padding-top: calc(env(safe-area-inset-top) + 30px);
      }

      .invite-card {
        margin-top: 84px;
        width: calc(100vw - 48px);
        max-height: calc(100svh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 230px);
      }

      .invite-actions {
        width: 58%;
        bottom: -1.9%;
        gap: 10px;
      }

      .pill {
        min-height: 48px;
        padding: 0 14px;
        font-size: 15px;
      }

      .invite-actions .wide {
        grid-column: 1 / -1;
      }

      .floating-controls {
        left: 24px;
        right: 24px;
        bottom: calc(env(safe-area-inset-bottom) + 24px);
      }

      .control-btn {
        min-height: 52px;
        padding: 0 22px;
      }
    }

    @media (max-width: 390px) {
      .invite-actions {
        width: 62%;
      }

      .pill {
        min-height: 44px;
        font-size: 13px;
      }

      .control-btn {
        padding: 0 18px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <h1 class="sr-only">Tobias and Michelle’s Wedding</h1>

    <section class="invite-card" aria-label="Wedding invitation">
      <div class="invite-wrap">
        <img
          class="invite-img"
          src="assets/weddinginvite.png?v=15"
          alt="You’re invited to our wedding. Tobias and Michelle. Saturday, June 6, 2026. Carne Mare."
        />

        <nav class="invite-actions" aria-label="Wedding links">
          <a class="pill wide" href="mailto:rsvp@luna.wedding?subject=RSVP%20for%20Toby%20and%20Michelle%E2%80%99s%20Wedding">RSVP</a>
          <a class="pill wide" href="assets/luna-wedding.ics">Add to Calendar</a>
          <a class="pill" href="venue.html">Venue</a>
          <a class="pill" href="registry.html">Registry</a>
          <a class="pill wide" href="faq.html">FAQ</a>
          <a class="pill wide" href="mailto:hello@luna.wedding?subject=Question%20about%20the%20wedding">Contact the Couple</a>
        </nav>
      </div>
    </section>
  </main>

  <div class="floating-controls" aria-label="Controls">
    <button class="control-btn" id="musicBtn" type="button" aria-pressed="false">
      <span class="dot" aria-hidden="true"></span>
      <span id="musicLabel">Music Off</span>
    </button>

    <button class="control-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="menuPanel">
      Menu
    </button>
  </div>

  <aside class="menu-panel" id="menuPanel" aria-hidden="true">
    <button class="close-menu" id="closeMenu" type="button" aria-label="Close menu">×</button>

    <nav class="menu-links" aria-label="Main menu">
      <a href="/">Home</a>
      <a href="venue.html">Venue</a>
      <a href="faq.html">FAQ</a>
      <a href="registry.html">Registry</a>
      <a href="mailto:rsvp@luna.wedding?subject=RSVP%20for%20Toby%20and%20Michelle%E2%80%99s%20Wedding">RSVP</a>
      <a href="mailto:hello@luna.wedding?subject=Question%20about%20the%20wedding">Contact the Couple</a>
    </nav>
  </aside>

  <audio id="weddingMusic" preload="auto" loop>
    <source src="assets/music.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const menuBtn = document.getElementById("menuBtn");
    const closeMenu = document.getElementById("closeMenu");
    const menuPanel = document.getElementById("menuPanel");

    function openMenu() {
      menuPanel.classList.add("is-open");
      menuPanel.setAttribute("aria-hidden", "false");
      menuBtn.setAttribute("aria-expanded", "true");
    }

    function closeMenuPanel() {
      menuPanel.classList.remove("is-open");
      menuPanel.setAttribute("aria-hidden", "true");
      menuBtn.setAttribute("aria-expanded", "false");
    }

    menuBtn.addEventListener("click", openMenu);
    closeMenu.addEventListener("click", closeMenuPanel);

    menuPanel.addEventListener("click", function (event) {
      if (event.target === menuPanel) closeMenuPanel();
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closeMenuPanel();
    });

    const music = document.getElementById("weddingMusic");
    const musicBtn = document.getElementById("musicBtn");
    const musicLabel = document.getElementById("musicLabel");

    let musicWanted = false;
    let hasTriedGesturePlay = false;

    function setMusicUI(isPlaying) {
      musicBtn.setAttribute("aria-pressed", String(isPlaying));
      musicLabel.textContent = isPlaying ? "Music On" : "Music Off";
    }

    async function playMusic() {
      try {
        await music.play();
        setMusicUI(true);
      } catch (error) {
        setMusicUI(false);
      }
    }

    function pauseMusic() {
      music.pause();
      setMusicUI(false);
    }

    musicBtn.addEventListener("click", function (event) {
      event.stopPropagation();

      if (music.paused) {
        musicWanted = true;
        playMusic();
      } else {
        musicWanted = false;
        pauseMusic();
      }
    });

    /*
      Default is off.
      First tap/click/gesture anywhere on the page starts music once allowed by Safari.
    */
    function handleFirstGesture() {
      if (hasTriedGesturePlay) return;
      hasTriedGesturePlay = true;
      musicWanted = true;
      playMusic();
    }

    document.addEventListener("pointerdown", handleFirstGesture, { once: true });
    document.addEventListener("touchstart", handleFirstGesture, { once: true });
    document.addEventListener("click", handleFirstGesture, { once: true });

    document.addEventListener("visibilitychange", function () {
      if (document.hidden) {
        music.pause();
      } else if (musicWanted) {
        playMusic();
      }
    });

    setMusicUI(false);
  </script>
</body>
</html>
